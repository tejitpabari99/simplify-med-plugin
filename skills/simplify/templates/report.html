<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title</title>
<style>
:root{
  --bg:#ffffff;
  --fg:#14171a;
  --muted:#4b5563;
  --rule:#dfe3e8;
  --accent:#1d4ed8;
  --pop-bg:#111827;
  --pop-fg:#f9fafb;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f172a;
    --fg:#f1f5f9;
    --muted:#cbd5e1;
    --rule:#334155;
    --accent:#93c5fd;
    --pop-bg:#f1f5f9;
    --pop-fg:#111827;
  }
}
:root[data-theme="dark"]{
  --bg:#0f172a;
  --fg:#f1f5f9;
  --muted:#cbd5e1;
  --rule:#334155;
  --accent:#93c5fd;
  --pop-bg:#f1f5f9;
  --pop-fg:#111827;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:17px;
  line-height:1.65;
}
.page{max-width:720px;margin:0 auto;padding:28px 16px 64px;}
h1{font-size:1.6em;margin:0 0 16px;}
h2{font-size:1.2em;margin:0 0 10px;}
p{margin:0 0 12px;}
ul{margin:0 0 14px;padding-left:22px;}
li{margin:0 0 6px;}
section{border-top:1px solid var(--rule);padding-top:16px;margin-top:16px;break-inside:avoid-page;}
section.why-you-went{border-top:none;padding-top:0;margin-top:0;}
.lead{font-size:1.05em;}
.label{margin-bottom:6px;}
.interactive-hint{color:var(--muted);font-size:0.9em;margin:0 0 20px;}
dl{margin:0;}
dt{font-weight:600;margin-top:10px;}
dd{margin:2px 0 0;color:var(--muted);}
.term{border-bottom:1px dotted var(--accent);cursor:help;position:relative;}
.term::after{
  content: attr(data-def);
  display:none;
  position:absolute;
  left:0;
  top:100%;
  background:var(--pop-bg);
  color:var(--pop-fg);
  padding:8px 10px;
  border-radius:8px;
  font-size:0.82em;
  line-height:1.4;
  width:max-content;
  max-width:260px;
  box-shadow:0 6px 16px rgba(0,0,0,.25);
  z-index:30;
  margin-top:4px;
}
.term:hover::after,.term:focus::after,.term.open::after{display:block;}
footer{margin-top:36px;font-size:0.85em;color:var(--muted);}
@media print{
  :root{--bg:#ffffff;--fg:#000000;--muted:#333333;--rule:#999999;}
  body{font-size:12pt;}
  .page{max-width:none;padding:0;}
  .interactive-hint{display:none;}
  .term{border-bottom:none;}
  .term::after{display:none;}
}
</style>
</head>
<body>
<div class="page">
$body
</div>
<script>
(function () {
  "use strict";
  document.querySelectorAll(".term").forEach(function (t) {
    t.addEventListener("click", function (e) {
      var wasOpen = t.classList.contains("open");
      document.querySelectorAll(".term.open").forEach(function (o) { o.classList.remove("open"); });
      if (!wasOpen) { t.classList.add("open"); }
      e.stopPropagation();
    });
  });
  document.addEventListener("click", function () {
    document.querySelectorAll(".term.open").forEach(function (t) { t.classList.remove("open"); });
  });
})();
</script>
</body>
</html>
